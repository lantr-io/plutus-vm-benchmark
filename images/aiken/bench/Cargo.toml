[package]
name = "aiken-bench"
version = "0.1.0"
edition = "2024"
publish = false

# The Dockerfile clones aiken-lang/aiken next to this crate, at ../aiken.
[dependencies]
uplc = { path = "../aiken/crates/uplc" }
# The Criterion of the amaru-uplc row: the version of its Cargo.lock (0.7.0) and the same
# features (crates/uplc/Cargo.toml of pragma-org/uplc: html_reports), so both Rust rows use one
# framework. The run scripts pass --noplot, so no report is drawn.
criterion = { version = "=0.7.0", features = ["html_reports"] }

[[bin]]
name = "aiken-bench"
path = "src/bench.rs"

[[bin]]
name = "aiken-check"
path = "src/check.rs"

# The profile of the aiken release binaries (spec D16). aiken v1.1.24 builds them with cargo-dist
# and this profile (aiken-lang/aiken Cargo.toml:160-163): the release defaults (opt-level 3, 16
# codegen units) with thin LTO. The Dockerfile builds with --profile dist.
[profile.dist]
inherits = "release"
lto = "thin"
